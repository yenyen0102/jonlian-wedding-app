<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>婚禮招待專用桌位系統</title>
  <style>
    /* ==========================================
       1. 基本重置與變數定義
       ========================================== */
    :root {
      --bg-color: #fdfbf7;
      --primary-color: #d4a373;
      --table-bg: #ffffff;
      --table-border: #e6ccb2;
      --table-shadow: rgba(0, 0, 0, 0.05);
      --carpet-color: #e63946;
      --carpet-bg: #ffccd5;
      --text-main: #4a4e69;
      --accent-gold: #b5838d;
      --grid-gap: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      margin-bottom: 16px;
      text-align: center;
    }

    header h1 {
      font-size: 1.4rem;
      color: #6b705c;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.85rem;
      color: #a5a58d;
    }

    /* ==========================================
       2. 地圖外觀與響應式捲動容器
       ========================================== */
    .map-wrapper {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      padding-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .venue-grid {
      display: grid;
      grid-template-columns: minmax(65px, 1fr) repeat(3, minmax(75px, 1fr)) 45px repeat(3, minmax(75px, 1fr));
      grid-gap: var(--grid-gap);
      min-width: 680px;
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      position: relative;
    }

    /* ==========================================
       3. 通用元件樣式 (按鈕與區域)
       ========================================== */
    .table-btn {
      background-color: var(--table-bg);
      border: 2px solid var(--table-border);
      border-radius: 50%;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 2px 6px var(--table-shadow);
      transition: all 0.2s ease;
      user-select: none;
      outline: none;
    }

    .table-btn:hover, .table-btn:active {
      transform: scale(1.05);
      border-color: var(--primary-color);
      box-shadow: 0 4px 12px rgba(212, 163, 115, 0.3);
    }

    .table-btn .number {
      font-weight: bold;
      font-size: 1.1rem;
      color: #333;
    }

    .table-btn .label {
      font-size: 0.65rem;
      color: #888;
      margin-top: 2px;
    }

    .facility-box {
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
    }

    .stage {
      grid-column: 2 / span 7;
      background-color: #eddcd2;
      color: #7f5539;
      padding: 12px;
      border: 1px dashed #cb997e;
    }

    .control-panel {
      grid-column: 1;
      grid-row: 1;
      background-color: #e9ecef;
      color: #495057;
      border: 1px solid #ced4da;
    }

    .main-table {
      grid-column: 5;
      grid-row: 2;
      background-color: #fff0f3;
      border: 2px solid #ff4d6d;
      color: #c9184a;
      border-radius: 50%;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 10px rgba(255, 77, 109, 0.2);
      cursor: pointer;
    }

    .buffet {
      grid-column: 6 / span 3;
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
      padding: 8px;
    }

    .backup-table {
      border-style: dashed;
      background-color: #f8f9fa;
      opacity: 0.8;
    }

    /* L 型進場走道 (紅毯) */
    .carpet-v {
      grid-column: 5;
      grid-row: 3 / span 4;
      background-color: var(--carpet-bg);
      border-left: 2px dashed var(--carpet-color);
      border-right: 2px dashed var(--carpet-color);
      display: flex;
      justify-content: center;
      align-items: center;
      writing-mode: vertical-lr;
      color: var(--carpet-color);
      font-size: 0.75rem;
      letter-spacing: 4px;
      font-weight: bold;
      z-index: 1;
    }

    .carpet-h {
      grid-column: 2 / span 4;
      grid-row: 6;
      background-color: var(--carpet-bg);
      border-top: 2px dashed var(--carpet-color);
      border-bottom: 2px dashed var(--carpet-color);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--carpet-color);
      font-size: 0.75rem;
      letter-spacing: 4px;
      font-weight: bold;
      z-index: 1;
    }

    /* 桌位網格精確定位 (Grid Position) */
    .t-02 { grid-column: 3; grid-row: 3; }
    .t-03 { grid-column: 4; grid-row: 3; }
    .t-04 { grid-column: 3; grid-row: 4; }
    .t-05 { grid-column: 4; grid-row: 4; }
    .t-06 { grid-column: 3; grid-row: 5; }
    .t-07 { grid-column: 4; grid-row: 5; }

    .t-08 { grid-column: 2; grid-row: 7; }
    .t-09 { grid-column: 3; grid-row: 7; }
    .t-10 { grid-column: 4; grid-row: 7; }
    
    .t-11 { grid-column: 3; grid-row: 8; }
    .t-12 { grid-column: 4; grid-row: 8; }

    .t-13 { grid-column: 6; grid-row: 3; }
    .t-14 { grid-column: 7; grid-row: 3; }
    .t-15 { grid-column: 8; grid-row: 3; }
    
    .t-16 { grid-column: 6; grid-row: 4; }
    .t-17 { grid-column: 7; grid-row: 4; }
    .t-18 { grid-column: 8; grid-row: 4; }
    
    .t-19 { grid-column: 6; grid-row: 5; }
    .t-20 { grid-column: 7; grid-row: 5; }
    .t-21 { grid-column: 8; grid-row: 5; }

    .t-22 { grid-column: 6; grid-row: 6; }
    .t-23 { grid-column: 7; grid-row: 6; }
    .t-27 { grid-column: 8; grid-row: 6; }

    .t-24 { grid-column: 6; grid-row: 7; }
    .t-25 { grid-column: 7; grid-row: 7; }
    .t-26 { grid-column: 8; grid-row: 7; }

    .buffet-pos { grid-row: 8; }

    /* ==========================================
       4. 彈出視窗 (Modal) 樣式
       ========================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: flex-end; /* 手機版底部彈出 */
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    @media (min-width: 600px) {
      .modal-overlay {
        align-items: center; /* 桌機版居中顯示 */
      }
      .modal-card {
        border-radius: 16px;
        max-height: 80vh;
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #333;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #888;
      cursor: pointer;
      padding: 0 8px;
    }

    .guest-list {
      overflow-y: auto;
      flex: 1;
      padding-right: 4px;
    }

    .guest-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 8px;
      border-bottom: 1px solid #f5f5f5;
    }

    .guest-item.backup-guest {
      background-color: #fafafa;
    }

    .guest-name {
      font-size: 0.95rem;
      color: #333;
      font-weight: 500;
    }

    .guest-item.backup-guest .guest-name {
      color: #aaa;
      font-style: italic;
    }

    .checkbox-group {
      display: flex;
      gap: 12px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      color: #666;
      cursor: pointer;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary-color);
    }
  </style>
</head>

    // 2. 自動構建桌位資料庫（包含補滿預備位邏輯）
    const tablesDatabase = {};

    function initTablesData() {
      // 初始化 1 ~ 27 桌
      for (let i = 1; i <= 27; i++) {
        const tableNumStr = i < 10 ? `0${i}` : `${i}`;
        
        let maxCap = 11;
        let isBackupTable = false;

        if (tableNumStr === "01") {
          maxCap = 12; // 主桌上限 12 人
        } else if (tableNumStr === "26" || tableNumStr === "27") {
          isBackupTable = true; // 預備桌全預備位
        }

        let guests = [];

        if (!isBackupTable) {
          // 抓取名單內該桌的賓客
          const list = rawGuestData.filter(g => g.table === tableNumStr);
          guests = list.map(g => ({ name: g.name, isBackup: false }));

          // 計算並補充預備位
          const neededBackup = maxCap - guests.length;
          for (let b = 1; b <= neededBackup; b++) {
            const backupName = (tableNumStr === "01") 
              ? `主桌預備位 ${b}` 
              : `第 ${tableNumStr} 桌預備位 ${b}`;
            guests.push({ name: backupName, isBackup: true });
          }
        } else {
          // 26、27 預備桌全自動生成 11 位
          for (let b = 1; b <= 11; b++) {
            guests.push({ name: `${tableNumStr}桌預備位 ${b}`, isBackup: true });
          }
        }

        tablesDatabase[tableNumStr] = guests;
      }
    }

    // 狀態暫存（記住 Checked 狀態）
    const checkState = {};

    // 3. Modal 互動控制 logic
    function openModal(tableNumStr) {
      const modal = document.getElementById("modalOverlay");
      const title = document.getElementById("modalTitle");
      const listContainer = document.getElementById("guestList");

      title.innerText = (tableNumStr === "01") ? "主桌 (01桌) 賓客名單" : `第 ${tableNumStr} 桌 賓客名單`;
      listContainer.innerHTML = "";

      const guests = tablesDatabase[tableNumStr] || [];

      guests.forEach((guest, index) => {
        const keyCheckin = `${tableNumStr}_${index}_checkin`;
        const keyGift = `${tableNumStr}_${index}_gift`;

        const isCheckedIn = !!checkState[keyCheckin];
        const isGiftTaken = !!checkState[keyGift];

        const itemDiv = document.createElement("div");
        itemDiv.className = `guest-item ${guest.isBackup ? 'backup-guest' : ''}`;
        
        itemDiv.innerHTML = `
          <span class="guest-name">${guest.name}</span>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" ${isCheckedIn ? 'checked' : ''} onchange="toggleCheck('${keyCheckin}', this.checked)">
              報到
            </label>
            <label class="checkbox-label">
              <input type="checkbox" ${isGiftTaken ? 'checked' : ''} onchange="toggleCheck('${keyGift}', this.checked)">
              喜餅
            </label>
          </div>
        `;

        listContainer.appendChild(itemDiv);
      });

      modal.classList.add("active");
    }

    function closeModal() {
      document.getElementById("modalOverlay").classList.remove("active");
    }

    function closeModalOnOverlay(event) {
      if (event.target.id === "modalOverlay") {
        closeModal();
      }
    }

    function toggleCheck(key, isChecked) {
      checkState[key] = isChecked;
    }

    // 頁面初始化
    initTablesData();
  </script>
