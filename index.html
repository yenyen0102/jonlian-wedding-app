<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>婚宴招待桌位點名系統</title>
  <style>
    /* ==========================================
       1. 基本重置與變數定義
       ========================================== */
    :root {
      --bg-color: #f8f9fa;
      --primary-color: #d4a373;
      --table-bg: #ffffff;
      --table-border: #ccd5ae;
      --table-shadow: rgba(0, 0, 0, 0.06);
      --carpet-color: #e63946;
      --carpet-bg: #ffccd5;
      --text-main: #333333;
      --grid-gap: 6px; /* 縮小間距以適應手機全寬 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100vw;
      overflow-x: hidden; /* 確保絕不出現左右滑動條 */
    }

    header {
      margin-bottom: 10px;
      text-align: center;
    }

    header h1 {
      font-size: 1.2rem;
      color: #588157;
      margin-bottom: 2px;
    }

    header p {
      font-size: 0.75rem;
      color: #6c757d;
    }

    /* ==========================================
       2. 貼合手機螢幕的全寬網格系統
       ========================================== */
    .map-container {
      width: 100%;
      max-width: 480px; /* 直立手機最佳寬度 */
      margin: 0 auto;
    }

    .venue-grid {
      display: grid;
      /* 8 欄配置：1(控) 2~4(左區) 5(走道) 6~8(右區) */
      grid-template-columns: 0.9fr repeat(3, 1fr) 0.6fr repeat(3, 1fr);
      grid-template-rows: repeat(9, auto);
      grid-gap: var(--grid-gap);
      background: #ffffff;
      padding: 10px 6px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      width: 100%;
    }

    /* ==========================================
       3. 桌位與設施通用樣式
       ========================================== */
    .table-btn {
      background-color: var(--table-bg);
      border: 1.5px solid var(--table-border);
      border-radius: 50%;
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 1px 4px var(--table-shadow);
      transition: transform 0.1s ease;
      outline: none;
      padding: 0;
    }

    .table-btn:active {
      transform: scale(0.92);
      background-color: #f0f3f4;
    }

    .table-btn .number {
      font-weight: bold;
      font-size: 0.9rem;
      color: #2b2d42;
      line-height: 1;
    }

    .table-btn .label {
      font-size: 0.55rem;
      color: #8d99ae;
      margin-top: 2px;
      transform: scale(0.9);
    }

    /* 特別區域 (舞台、控臺、主桌、備餐臺) */
    .facility-box {
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.75rem;
      font-weight: bold;
      text-align: center;
    }

    .stage {
      grid-column: 2 / span 7;
      grid-row: 1;
      background-color: #e9ecef;
      color: #495057;
      padding: 8px 0;
      border: 1px dashed #adb5bd;
    }

    .control-panel {
      grid-column: 1;
      grid-row: 1;
      background-color: #dee2e6;
      color: #343a40;
      font-size: 0.65rem;
    }

    /* 4. 主桌放大優化 */
    .main-table {
      grid-column: 5;
      grid-row: 2;
      background-color: #ffe5ec;
      border: 2.5px solid #ff0054;
      color: #ff0054;
      border-radius: 50%;
      width: 130%; /* 比普通桌放大 */
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 8px rgba(255, 0, 84, 0.3);
      cursor: pointer;
      justify-self: center;
      align-self: center;
      z-index: 2;
    }

    .main-table .number {
      font-weight: bold;
      font-size: 0.85rem;
    }

    .main-table .label {
      font-size: 0.55rem;
    }

    /* 3. 備餐臺縮小優化 (置於右下靠邊) */
    .buffet {
      grid-column: 8;
      grid-row: 9;
      background-color: #d8f3dc;
      color: #2d6a4f;
      border: 1px solid #b7e4c7;
      font-size: 0.6rem;
      padding: 4px 0;
    }

    .backup-table {
      border-style: dashed;
      background-color: #f8f9fa;
    }

    /* L 型進場走道 (紅毯) */
    .carpet-v {
      grid-column: 5;
      grid-row: 3 / span 4;
      background-color: var(--carpet-bg);
      border-left: 1.5px dashed var(--carpet-color);
      border-right: 1.5px dashed var(--carpet-color);
      display: flex;
      justify-content: center;
      align-items: center;
      writing-mode: vertical-lr;
      color: var(--carpet-color);
      font-size: 0.65rem;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .carpet-h {
      grid-column: 2 / span 4;
      grid-row: 6;
      background-color: var(--carpet-bg);
      border-top: 1.5px dashed var(--carpet-color);
      border-bottom: 1.5px dashed var(--carpet-color);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--carpet-color);
      font-size: 0.65rem;
      letter-spacing: 2px;
      font-weight: bold;
    }

    /* 桌位 Grid 精確定位 */
    .t-02 { grid-column: 3; grid-row: 3; }
    .t-03 { grid-column: 4; grid-row: 3; }
    .t-04 { grid-column: 3; grid-row: 4; }
    .t-05 { grid-column: 4; grid-row: 4; }
    .t-06 { grid-column: 3; grid-row: 5; }
    .t-07 { grid-column: 4; grid-row: 5; }

    .t-08 { grid-column: 2; grid-row: 7; }
    .t-09 { grid-column: 3; grid-row: 7; }
    .t-10 { grid-column: 4; grid-row: 7; }
    
    .t-11 { grid-column: 3; grid-row: 8; }
    .t-12 { grid-column: 4; grid-row: 8; }

    /* 右側桌區 */
    .t-13 { grid-column: 6; grid-row: 3; }
    .t-14 { grid-column: 7; grid-row: 3; }
    .t-15 { grid-column: 8; grid-row: 3; }
    
    .t-16 { grid-column: 6; grid-row: 4; }
    .t-17 { grid-column: 7; grid-row: 4; }
    .t-18 { grid-column: 8; grid-row: 4; }
    
    .t-19 { grid-column: 6; grid-row: 5; }
    .t-20 { grid-column: 7; grid-row: 5; }
    .t-21 { grid-column: 8; grid-row: 5; }

    /* 右側 22~27 桌下移調配 */
    .t-22 { grid-column: 6; grid-row: 7; }
    .t-23 { grid-column: 7; grid-row: 7; }
    .t-27 { grid-column: 8; grid-row: 7; }

    .t-24 { grid-column: 6; grid-row: 8; }
    .t-25 { grid-column: 7; grid-row: 8; }
    .t-26 { grid-column: 8; grid-row: 8; }

    /* ==========================================
       4. 1. 修正 Modal 可滑動與滾動問題
       ========================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      height: 75vh; /* 固定高度確保可滾動區域明確 */
      max-height: 80vh;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 16px 16px 24px 16px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s ease-out;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 10px;
      margin-bottom: 8px;
      flex-shrink: 0; /* 標頭不縮小 */
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #333;
    }

    .modal-close {
      background: #f1f3f5;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 1.2rem;
      color: #666;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 關鍵修復：使 guest-list 區域能穩定上下滑動 */
    .guest-list {
      flex: 1;
      overflow-y: scroll !important;
      -webkit-overflow-scrolling: touch; /* iOS 流暢滑動 */
      padding-bottom: 40px; /* 預留底部空間防止被手機操作列遮擋 */
    }

    .guest-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 8px;
      border-bottom: 1px solid #f1f3f5;
    }

    .guest-item.backup-guest {
      background-color: #f8f9fa;
    }

    .guest-name {
      font-size: 0.95rem;
      color: #212529;
      font-weight: 500;
    }

    .guest-item.backup-guest .guest-name {
      color: #adb5bd;
      font-style: italic;
    }

    .checkbox-group {
      display: flex;
      gap: 12px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      color: #495057;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #d4a373;
    }
  </style>
</head>

    const tablesDatabase = {};
    const checkState = {};

    function initTablesData() {
      for (let i = 1; i <= 27; i++) {
        const tableNumStr = i < 10 ? `0${i}` : `${i}`;
        let maxCap = (tableNumStr === "01") ? 12 : 11;
        let isBackupTable = (tableNumStr === "26" || tableNumStr === "27");

        let guests = [];

        if (!isBackupTable) {
          const list = rawGuestData.filter(g => g.table === tableNumStr);
          guests = list.map(g => ({ name: g.name, isBackup: false }));

          const neededBackup = maxCap - guests.length;
          for (let b = 1; b <= neededBackup; b++) {
            const backupName = (tableNumStr === "01") 
              ? `主桌預備位 ${b}` 
              : `第 ${tableNumStr} 桌預備位 ${b}`;
            guests.push({ name: backupName, isBackup: true });
          }
        } else {
          for (let b = 1; b <= 11; b++) {
            guests.push({ name: `${tableNumStr}桌預備位 ${b}`, isBackup: true });
          }
        }

        tablesDatabase[tableNumStr] = guests;
      }
    }

    function openModal(tableNumStr) {
      const modal = document.getElementById("modalOverlay");
      const title = document.getElementById("modalTitle");
      const listContainer = document.getElementById("guestList");

      title.innerText = (tableNumStr === "01") ? "主桌 (01桌) 賓客名單" : `第 ${tableNumStr} 桌 賓客名單`;
      listContainer.innerHTML = "";

      const guests = tablesDatabase[tableNumStr] || [];

      guests.forEach((guest, index) => {
        const keyCheckin = `${tableNumStr}_${index}_checkin`;
        const keyGift = `${tableNumStr}_${index}_gift`;

        const isCheckedIn = !!checkState[keyCheckin];
        const isGiftTaken = !!checkState[keyGift];

        const itemDiv = document.createElement("div");
        itemDiv.className = `guest-item ${guest.isBackup ? 'backup-guest' : ''}`;
        
        itemDiv.innerHTML = `
          <span class="guest-name">${guest.name}</span>
          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" ${isCheckedIn ? 'checked' : ''} onchange="toggleCheck('${keyCheckin}', this.checked)">
              報到
            </label>
            <label class="checkbox-label">
              <input type="checkbox" ${isGiftTaken ? 'checked' : ''} onchange="toggleCheck('${keyGift}', this.checked)">
              喜餅
            </label>
          </div>
        `;

        listContainer.appendChild(itemDiv);
      });

      modal.classList.add("active");
    }

    function closeModal() {
      document.getElementById("modalOverlay").classList.remove("active");
    }

    function closeModalOnOverlay(event) {
      if (event.target.id === "modalOverlay") {
        closeModal();
      }
    }

    function toggleCheck(key, isChecked) {
      checkState[key] = isChecked;
    }

    // 初始化
    initTablesData();
