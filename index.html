<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>婚禮宴席桌位圖 - 招待版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f8f9fa; color: #333; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* 上方統計區 */
    .header-card {
      background: #fff;
      padding: 12px 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      z-index: 10;
    }
    .stats-title { font-size: 18px; font-weight: bold; color: #444; margin-bottom: 8px; }
    .stats-count { color: #e74c3c; font-size: 22px; font-weight: bold; }
    
    .search-box {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }
    .search-input {
      width: 100%;
      padding: 8px 16px 8px 36px;
      border: 1.5px solid #3498db;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
    }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #888; }

    /* 地圖滿版區域 */
    .map-container {
      flex: 1;
      position: relative;
      background: #ffffff;
      margin: 8px;
      border: 2px solid #e2c974;
      border-radius: 12px;
      overflow: hidden;
    }

    /* 舞台 */
    .stage {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #c59b27;
      color: white;
      padding: 4px 30px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 13px;
    }

    /* 控制與備餐區 */
    .zone-box {
      position: absolute;
      border: 1px solid #ccc;
      background: #f0f0f0;
      color: #666;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }
    .control-zone { top: 12px; left: 12px; width: 45px; height: 25px; }
    .prep-zone { bottom: 12px; right: 12px; width: 65px; height: 25px; }

    /* 迎賓送客區 (延伸至接近08桌/進場走道) */
    .welcome-zone {
      position: absolute;
      left: 12px;
      bottom: 12px;
      width: 75px;
      height: 42%; /* 向上延伸到走道與08桌高度 */
      border: 1.5px dashed #c59b27;
      background: #fffdf0;
      color: #b38600;
      font-size: 11px;
      font-weight: bold;
      writing-mode: vertical-lr;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      letter-spacing: 2px;
    }

    /* 走道動線 */
    .aisle-line-v {
      position: absolute;
      width: 2px;
      background: #f5d0a9;
      top: 105px;
      left: 45%;
      height: calc(100% - 280px);
    }
    .aisle-line-h {
      position: absolute;
      height: 2px;
      background: #f5d0a9;
      bottom: 175px;
      left: 24%;
      width: 21%;
    }
    .aisle-tag {
      position: absolute;
      background: #fff;
      border: 1px solid #f5d0a9;
      color: #d35400;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 8px;
    }

    /* 桌位通用樣式 */
    .table-node {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid #d4af37;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      transition: transform 0.2s, background-color 0.2s;
    }
    .table-node:active { transform: scale(0.95); }
    .table-title { font-size: 11px; font-weight: bold; color: #333; }
    .table-count { font-size: 9px; color: #777; margin-top: 1px; }

    /* 特殊桌位：主桌 (比02,03更靠前) */
    .table-main {
      width: 62px;
      height: 62px;
      border: 2px solid #e74c3c;
      background: #fff0f0;
      top: 42px; /* 靠近舞台 */
      left: 39%;
    }
    .table-main .table-title { color: #c0392b; font-size: 12px; }

    /* Modal 彈窗 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none; justify-content: center; align-items: flex-end;
      z-index: 100;
    }
    .modal-content {
      background: white; width: 100%; max-width: 500px;
      border-radius: 16px 16px 0 0; max-height: 80vh;
      display: flex; flex-direction: column; animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-header {
      padding: 16px; border-bottom: 1px solid #eee;
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-body { padding: 12px 16px; overflow-y: auto; flex: 1; }
    .guest-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid #f5f5f5;
    }
    .check-btn {
      padding: 6px 12px; border-radius: 16px; border: none;
      font-size: 12px; font-weight: bold; cursor: pointer;
    }
    .btn-absent { background: #eee; color: #666; }
    .btn-present { background: #2ecc71; color: white; }
  </style>
</head>

      ["許夏賓",25,"榮星大家庭6"],["林吟潔",25,"榮星大家庭6"],["鄭歆樺",25,"榮星大家庭6"],["葉頌興",25,"榮星大家庭6"],["陳乙瑄",25,"榮星大家庭6"],["林秋冠",25,"榮星大家庭6"],["鄭淑芬",25,"榮星大家庭6"],["陳威勳",25,"榮星大家庭6"],["黃巧馨",25,"榮星大家庭6"],["邱彥瑋",25,"榮星大家庭6"],["邱主竭(小孩)",25,"榮星大家庭6"]
    ];

    // 桌位座標百分比 (適應直態螢幕)
    const tablePositions = {
      1: { top: '8%', left: '39%', isMain: true }, // 主桌更靠近舞台
      2: { top: '15%', left: '20%' }, 3: { top: '15%', left: '38%' },
      13: { top: '15%', left: '60%' }, 14: { top: '15%', left: '78%' },
      
      4: { top: '27%', left: '20%' }, 5: { top: '27%', left: '38%' },
      16: { top: '27%', left: '60%' }, 17: { top: '27%', left: '78%' },
      
      6: { top: '39%', left: '20%' }, 7: { top: '39%', left: '38%' },
      19: { top: '39%', left: '60%' }, 20: { top: '39%', left: '78%' },
      
      8: { top: '56%', left: '20%' }, 9: { top: '56%', left: '38%' }, 10: { top: '56%', left: '56%' },
      22: { top: '56%', left: '78%' },
      
      11: { top: '68%', left: '32%' }, 12: { top: '68%', left: '50%' },
      23: { top: '68%', left: '78%' },
      
      24: { top: '80%', left: '60%' }, 25: { top: '80%', left: '78%' }
    };

    let guests = rawData.map((item, index) => ({
      id: index,
      name: item[0],
      table: item[1],
      group: item[2],
      arrived: false
    }));

    function init() {
      document.getElementById('total-count').innerText = guests.length;
      renderTables();
    }

    function renderTables() {
      const layer = document.getElementById('tables-layer');
      layer.innerHTML = '';

      for (let i = 1; i <= 25; i++) {
        const pos = tablePositions[i];
        if (!pos) continue;

        const tableGuests = guests.filter(g => g.table === i);
        const arrivedCount = tableGuests.filter(g => g.arrived).length;

        const div = document.createElement('div');
        div.className = `table-node ${pos.isMain ? 'table-main' : ''}`;
        div.style.width = pos.isMain ? '60px' : '48px';
        div.style.height = pos.isMain ? '60px' : '48px';
        div.style.top = pos.top;
        div.style.left = pos.left;
        div.onclick = () => openModal(i);

        const title = i === 1 ? '主桌' : `${i < 10 ? '0' + i : i} 桌`;
        div.innerHTML = `
          <div class="table-title">${title}</div>
          <div class="table-count">${arrivedCount}/${tableGuests.length}人</div>
        `;

        layer.appendChild(div);
      }
    }

    function updateStats() {
      const arrivedTotal = guests.filter(g => g.arrived).length;
      document.getElementById('arrived-count').innerText = arrivedTotal;
      renderTables();
    }

    let currentTable = null;
    function openModal(tableNum) {
      currentTable = tableNum;
      const modal = document.getElementById('modal-overlay');
      const title = document.getElementById('modal-title');
      const body = document.getElementById('modal-body');

      const tableGuests = guests.filter(g => g.table === tableNum);
      const groupName = tableGuests[0] ? tableGuests[0].group : '';

      title.innerText = tableNum === 1 ? `主桌 (${groupName})` : `第 ${tableNum} 桌 - ${groupName}`;
      
      body.innerHTML = tableGuests.map(g => `
        <div class="guest-item">
          <span>${g.name}</span>
          <button class="check-btn ${g.arrived ? 'btn-present' : 'btn-absent'}" onclick="toggleArrive(${g.id})">
            ${g.arrived ? '已報到' : '未報到'}
          </button>
        </div>
      `).join('');

      modal.style.display = 'flex';
    }

    function toggleArrive(guestId) {
      const guest = guests.find(g => g.id === guestId);
      if (guest) {
        guest.arrived = !guest.arrived;
        updateStats();
        openModal(currentTable);
      }
    }

    function closeModal(e) {
      if (!e || e.target.id === 'modal-overlay' || e.target.tagName === 'BUTTON') {
        document.getElementById('modal-overlay').style.display = 'none';
      }
    }

    function handleSearch() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      const found = guests.find(g => g.name.includes(query) || g.table.toString() === query);
      if (found) {
        openModal(found.table);
      }
    }

    init();
  </script>
</body>
